name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python examples/demo.py
      - run: python benchmarks/evaluate.py --projects 20 --repeats 1
      - run: python -m build
      - run: python -m twine check dist/*
  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gim
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: gim
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U gim -d gim'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GIM_TEST_POSTGRES_URL: postgresql://gim:ci-only@localhost:5432/gim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,postgres]'
      - run: pytest
